name: Release

# Publishes to npm when a version tag such as v0.1.0 is pushed. npm trusts
# this workflow through trusted publishing once the package's npm settings
# name it; until then (the first release) it uses the NPM_TOKEN secret.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm lint
      - run: pnpm typecheck
      - name: test
        run: |
          export HOME="$(mktemp -d)"
          unset PI_CODING_AGENT_DIR PI_BOUNCER_LOG_DIR
          pnpm test
      - run: pnpm build
      - run: node scripts/check-pack.mjs
      # prepack rebuilds dist/ inside npm publish.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
